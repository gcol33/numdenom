url: https://gillescolling.com/quotr

template:
  bootstrap: 5
  bootswatch: sandstone
  light-switch: true

figures:
  dev: svg
  fig.ext: svg
  bg: "#F5F6F8"

home:
  title: "quotr: Bayesian Hierarchical Models for Ratios"
  description: >
    Joint modelling of numerator and denominator processes with shared latent
    structure. Ratios computed post hoc with full uncertainty propagation.

authors:
  Gilles Colling:
    href: https://github.com/gcol33

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, lightswitch, github]
  components:
    intro:
      text: Get Started
      href: articles/getting-started.html
    articles:
      text: Articles
      menu:
        - text: "Getting Started"
          href: articles/getting-started.html
        - text: "Why Ratios Are Not Data"
          href: articles/philosophy.html
    github:
      icon: fab fa-github
      href: https://github.com/gcol33/quotr
      aria-label: GitHub

reference:
  - title: "Model Fitting"
    desc: "Main function for fitting quotr models"
    contents:
      - quotr

  - title: "Model Families"
    desc: "Distribution families for numerator/denominator processes"
    contents:
      - quotr_negbin_negbin
      - quotr_binomial
      - quotr_poisson_gamma

  - title: "Ratio Inference"
    desc: "Extract and compare ratio posteriors"
    contents:
      - ratio
      - ratio_contrast

  - title: "Spatial Structure"
    desc: "Spatial random effect specifications"
    contents:
      - spatial_car
      - spatial_bym2

  - title: "Priors"
    desc: "Prior specification helpers"
    contents:
      - quotr_priors

  - title: "Model Checking"
    desc: "Posterior predictive checks and model comparison"
    contents:
      - pp_check
      - loo.quotr_fit
      - waic.quotr_fit
      - quotr_compare

articles:
  - title: "Getting Started"
    navbar: ~
    contents:
      - getting-started

  - title: "Theory"
    navbar: ~
    contents:
      - philosophy

footer:
  structure:
    left: developed_by
    right: built_with
